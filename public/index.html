<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контроллер умного отопления</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="controller-card">
    <h2>Умное отопление</h2>
    
    <div class="input-group">
      <label for="temperature">Температура в комнате (°C):</label>
      <input type="text" id="temperature" placeholder="Например: 15">
    </div>

    <div class="input-group">
      <p class="label">Режим работы:</p>
      <div class="radio-group">
        <label>
          <input type="radio" name="mode" value="Эко" checked>
          Эко
        </label>
        <label>
          <input type="radio" name="mode" value="Комфорт">
          Комфорт
        </label>
      </div>
    </div>

    <button id="send-btn">Отправить команду</button>

    <div id="output-container" class="hidden">
      <p id="result-text"></p>
    </div>
    
    <div id="error-container" class="hidden">
      <p id="error-text"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
