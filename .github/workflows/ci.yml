name: CI Pipeline Smart Heating

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [master]

env:
  ALLURE_RESULTS_DIR: allure-results

jobs:
  # ============================================
  # JOB: Запуск тестов внутри Docker контейнера (Продвинутый уровень)
  # ============================================
  docker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t smart-heating-app .

      - name: Run Tests inside Docker
        run: |
          mkdir -p allure-results
          docker run --rm \
            -v ${{ github.workspace }}/allure-results:/app/allure-results \
            smart-heating-app \
            bash -c "npm start & npx wait-on http://localhost:3000 && npm run test:all"

      - name: Upload Allure results from Docker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-docker
          path: allure-results/

  # ============================================
  # JOB: Генерация Allure отчёта
  # ============================================
  allure-report:
    runs-on: ubuntu-latest
    needs: [unit-tests, api-tests, ui-tests]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          path: all-allure-results/

      - name: Merge Allure results
        run: |
          mkdir -p merged-allure-results
          find all-allure-results -name "*.json" -exec cp {} merged-allure-results/ \;
          find all-allure-results -name "*.txt" -exec cp {} merged-allure-results/ \;
          find all-allure-results -name "*.png" -exec cp {} merged-allure-results/ \;

      - name: Generate Allure report
        run: |
          npx allure generate merged-allure-results --clean -o allure-report

      - name: Upload Allure report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/

      - name: Deploy Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: allure-reports/${{ github.run_number }}

  # ============================================
  # JOB: Уведомление
  # ============================================
  notify:
    runs-on: ubuntu-latest
    needs: [unit-tests, api-tests, ui-tests, allure-report]
    if: always()

    steps:
      - name: Check overall status
        run: |
          if [ "${{ needs.unit-tests.result }}" = "success" ] && \
             [ "${{ needs.api-tests.result }}" = "success" ] && \
             [ "${{ needs.ui-tests.result }}" = "success" ]; then
            echo "✅ All tests passed!"
          else
            echo "❌ Some tests failed. Check Allure report for details."
            exit 1
          fi
      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🧪 Тесты умного отопления завершены!
            Статус: ${{ env.STATUS }}
            Ветка: ${{ github.ref }}
            Коммит: ${{ github.sha }}
            Отчет Allure: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure-reports/${{ github.run_number }}/
